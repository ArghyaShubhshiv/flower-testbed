services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: python server.py
    ports:
      - "8080:8080"
    volumes:
      - ./certificates/ca.crt:/app/certificates/ca.crt:ro
      - ./certificates/server.pem:/app/certificates/server.pem:ro
      - ./certificates/server.key:/app/certificates/server.key:ro
    networks:
      - fl-network

  client1:
    build:
      context: .
      dockerfile: Dockerfile.client
    command: python client.py --client-id 1
    depends_on:
      - server
    environment:
      - FL_SERVER_ADDRESS=server:8080
    volumes:
      - ./certificates/ca.crt:/app/certificates/ca.crt:ro
    networks:
      - fl-network

  client2:
    build:
      context: .
      dockerfile: Dockerfile.client
    command: python client.py --client-id 2
    depends_on:
      - server
    environment:
      - FL_SERVER_ADDRESS=server:8080
    volumes:
      - ./certificates/ca.crt:/app/certificates/ca.crt:ro
    networks:
      - fl-network

networks:
  fl-network:
    driver: bridge
